name: Collecte des prospects

on:
  schedule:
    # Tous les jours à 5h05 UTC, soit 7h05 en heure d'été française.
    #
    # Quotidien et non hebdomadaire, pour deux raisons : le flux de La Dépêche ne
    # conserve que 25 articles, donc un passage par semaine laisserait passer des
    # événements ; et Sirene publie en différé, ce qui fait que repasser souvent
    # rattrape les créations arrivées en retard.
    - cron: '5 5 * * *'
  workflow_dispatch: {}   # permet aussi de lancer la collecte à la main

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lancer la collecte
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          node src/collect.js 45 2>&1 | tee collecte.log

      # Recopie le compte rendu sur la page du run, pour qu'il soit lisible sans avoir
      # à déplier les journaux. La collecte n'affiche jamais la valeur des clés — elle
      # se contente d'indiquer leur présence — donc la publier ici ne révèle rien.
      - name: Publier le compte rendu
        if: always()
        run: |
          {
            echo '## Compte rendu de la collecte'
            echo ''
            echo '```'
            cat collecte.log 2>/dev/null || echo 'Aucune sortie : la collecte ne a pas démarré.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
